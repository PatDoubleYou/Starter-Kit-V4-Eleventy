<div class="row justify-content-center text-center" id="contact">
    <div class="col">
        <h2>Tell Us About Your Project</h2>
        <p class="lead">Fill out the form below and we'll be in touch to discuss your project.</p>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col col-xl-8">
        <form name="contact-v2" data-netlify="true" method="POST">
            
            <input type="hidden" name="form-name" value="contact-v2" />
            <input type="hidden" name="source_page" value="{{ page.url }}">
            
            <div class="mb-3">
                <label for="customer_name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="customer_name" name="customer_name" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customer_phone" class="form-label">Phone *</label>
                    <input type="tel" class="form-control" id="customer_phone" name="customer_phone" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="customer_email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="customer_email" name="customer_email" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="project_location" class="form-label">Project Location (City or Address) *</label>
                <input type="text" class="form-control" id="project_location" name="project_location" placeholder="e.g., St. George or full address" required>
            </div>

            <hr class="my-4">

            <div class="mb-3">
                <label class="form-label">What is the best starting point for your project? *</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="project_type" id="project_type_psa" value="Project Success Plan (PSA)" required>
                    <label class="form-check-label" for="project_type_psa">
                        <strong>Start My Project Plan (Paid PSA)</strong> - Best for complex remodels, new construction, or if you need help with design, selections, and a fixed-price.
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="project_type" id="project_type_estimate" value="Request an Estimate">
                    <label class="form-check-label" for="project_type_estimate">
                        <strong>Request an Estimate</strong> - Best for defined-scope projects like rental turnovers, punch lists, repairs, or simple cabinet installs.
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label for="service_type" class="form-label">What service are you looking for? *</label>
                <select class="form-control" id="service_type" name="service_type" required>
                    <option value="" selected disabled>Select a service *</option>
                    <option value="Residential Remodel (Kitchen, Bath, etc.)">Residential Remodel (Kitchen, Bath, etc.)</option>
                    <option value="Property Maintenance / Rental Turnover">Property Maintenance / Rental Turnover</option>
                    <option value="Real Estate Punch List">Real Estate Punch List</option>
                    <option value="Custom Cabinets & Built-Ins">Custom Cabinets & Built-Ins</option>
                    <option value="Restoration & Repair (Flood, etc.)">Restoration & Repair (Flood, etc.)</Goption>
                    <option value="Commercial TI">Commercial TI</option>
                    <option value="New Construction">New Construction</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="budget_range" class="form-label">What is your estimated budget? *</label>
                    <select class="form-control" id="budget_range" name="budget_range" required>
                        <option value="" selected disabled>Select a range</option>
                        <option value="Under $5,000">Under $5,000</option>
                        <option value="$5,000 - $10,000">$5,000 - $10,000</option>
                        <option value="$10,000 - $25,000">$10,000 - $25,000</option>
                        <option value="$25,000 - $50,000">$25,000 - $50,000</option>
                        <option value="$50,000 - $100,000">$50,000 - $100,000</option>
                        <option value="$100,000+">$100,000+</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="project_timeline" class="form-label">What is your ideal timeline? *</label>
                    <select class="form-control" id="project_timeline" name="project_timeline" required>
                        <option value="" selected disabled>Select a timeline</option>
                        <option value="ASAP / Emergency">ASAP / Emergency</option>
                        <option value="Within 1-3 Months">Within 1-3 Months</option>
                        <option value="Within 3-6 Months">Within 3-6 Months</option>
                        <option value="6+ Months / Just Planning">6+ Months / Just Planning</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="referral_source" class="form-label">How did you hear about us? *</label>
                <select class="form-control" id="referral_source" name="referral_source" required>
                    <option value="" selected disabled>Please select an option</option>
                    <option value="Friend or Family Referral">Friend or Family Referral</option>
                    <option value="Professional Referral (Realtor, PM, etc.)">Referral from a Professional</option>
                    <option value="Google / Online Search">Google / Online Search</option>
                    <option value="Social Media">Social Media (Facebook, Instagram, etc.)</option>
                    <option value="Saw Our Truck (Cybertruck)">Saw Our Truck (Cybertruck)</option>
                    <option value="Red Rock Property Management">Red Rock Property Management</option>
                    <option value="Returning Customer">I'm a Returning Customer</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="project_description" class="form-label">Project Description *</label>
                <textarea class="form-control" id="project_description" rows="5" name="project_description"
                    placeholder="Tell us more about your project... What are your goals? What problems are you trying to solve?" required></textarea>
            </div>
            
            <p class="form-required">* Required fields</p>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg mb-5">Send Project Inquiry</button>
            </div>
        </form>
    </div>
</div>
