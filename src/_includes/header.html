{% set navPages = collections.all | eleventyNavigation %}

<nav class="navbar fixed-top navbar-dark bg-dark navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <span class="navbar-brand" href="#"><img class="img-fluid" src="/assets/images/logo white.png" width="40"
                height="36" style="border-radius: 15px;" alt="Haggerty Construction's 'H' logo."></span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link {{ 'active' if '/' == page.url }}" aria-current="page" href="/">HOME</a>
                {# You should create a services.html page #}
                <a class="nav-link {{ 'active' if '/services/' == page.url }}" href="/services/">SERVICES</a>
                <a class="nav-link {{ 'active' if '/about/' == page.url }}" href="/about/">ABOUT</a>
                <a class="nav-link {{ 'active' if '/gallery/' == page.url }}" href="/gallery/">GALLERY</a>
                <a class="nav-link {{ 'active' if '/blog/' == page.url }}" href="/blog/">BLOG</a>
                <a class="nav-link {{ 'active' if '/contact/' == page.url }}" href="/contact/">CONTACT</a>
                <a class="nav-link" href="tel:{{ client.phone }}"><i class="bi bi-telephone-fill"></i> {{ client.phoneFormatted }}</a>
            </div>
        </div>
    </div>
</nav>
